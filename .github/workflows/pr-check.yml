name: Project Checks

on:
  push:
    branches: [main, develop, "feature/**"]
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

env:
  CI: "true"

permissions:
  contents: read

concurrency:
  group:
    checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      frontend: "true"
      rust: "true"
      formatting: "true"
      android: ${{ steps.filter.outputs.android || 'false' }}
      ios: ${{ steps.filter.outputs.ios || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Classify changed files
        if: github.event_name == 'pull_request'
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          python3 .github/scripts/ci_changes.py < "$RUNNER_TEMP/changed-files" >> "$GITHUB_OUTPUT"

  translation-parity:
    name: Translation parity
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Test translation checker
        run: node --test apps/frontend/scripts/check-translations.test.mjs
      - name: Check every language and namespace
        run: node apps/frontend/scripts/check-translations.mjs

  formatting:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.formatting == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          # No `cache: pnpm`: restore plus warm install is no faster than a cold
          # install, and each PR would save its own ~120 MB copy.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check

  frontend-check:
    name: Frontend Check
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          # No `cache: pnpm`: restore plus warm install is no faster than a cold
          # install, and each PR would save its own ~120 MB copy.

      - name: Prepare reports
        run: mkdir -p reports/frontend

      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile 2>&1 | tee reports/frontend/install.log

      - name: Build package types
        id: types
        run: pnpm run build:types

      - name: Lint
        run: pnpm lint 2>&1 | tee reports/frontend/lint.log

      - name: Type check packages
        # Declarations are already built above; the frontend build runs its type check.
        run: pnpm --filter './packages/*' -r type-check

      - name: Test Node helpers
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test scripts/*.test.mjs 2>&1 | tee reports/frontend/node-tests.log

      - name: Run all frontend tests
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        run:
          pnpm --filter frontend exec vitest run --reporter=default --reporter=junit
          --outputFile="$GITHUB_WORKSPACE/reports/frontend/junit.xml" 2>&1 | tee
          reports/frontend/tests.log

      - name: Build frontend
        id: web-build
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        run: pnpm build 2>&1 | tee reports/frontend/web-build.log

      - name: Install addon sandbox browsers
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run net worth layout regression tests
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
        run: pnpm test:e2e:net-worth

      - name: Run addon sandbox browser tests
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
        run: pnpm test:e2e:addon-sandbox
        env:
          WF_ADDON_SANDBOX_SKIP_BUILD: "true"

      - name: Build desktop frontend without Connect
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        run: pnpm build:tauri 2>&1 | tee reports/frontend/desktop-build.log
        env:
          CONNECT_AUTH_URL: ""
          CONNECT_AUTH_PUBLISHABLE_KEY: ""

      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-frontend-${{ github.run_attempt }}
          path: |
            reports/frontend/
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  rust-check:
    name: Rust Check
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup repository Rust toolchain
        run: rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # cache-warm.yml seeds this key on main. A PR's own copy (~2 GB) is
          # readable only by that PR and evicts the shared caches, so PRs
          # restore without saving.
          shared-key: pr-rust-check
          save-if: false

      - name: Prepare Rust reports
        run: mkdir -p reports/rust

      - name: Install system dependencies
        id: system
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Create dist folder for Tauri context
        run:
          mkdir -p dist && echo '<!DOCTYPE html><html><head></head><body></body></html>' >
          dist/index.html

      - name: Check formatting
        run: cargo fmt --all -- --check 2>&1 | tee reports/rust/format.log

      - name: Clippy
        if: ${{ !cancelled() && steps.system.outcome == 'success' }}
        run:
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee
          reports/rust/clippy.log

      - name: Test
        if: ${{ !cancelled() && steps.system.outcome == 'success' }}
        run: cargo test --locked --workspace --no-fail-fast 2>&1 | tee reports/rust/tests.log
        env:
          # Required for outbox tests in storage-sqlite
          CONNECT_API_URL: http://test.local

      - name: Test legacy library fixtures
        if: ${{ !cancelled() && steps.system.outcome == 'success' }}
        run:
          cargo test --locked -p wealthfolio-ai --features test-utils --no-fail-fast 2>&1 | tee
          reports/rust/library-fixtures.log

      - name: Check release build (src-server)
        if: ${{ !cancelled() && steps.system.outcome == 'success' }}
        run:
          cargo check --locked -p wealthfolio-server --release 2>&1 | tee
          reports/rust/server-release.log

      - name: Check personal runtimes without Connect
        if: ${{ !cancelled() && steps.system.outcome == 'success' }}
        run:
          cargo check --locked -p wealthfolio-app -p wealthfolio-server --no-default-features 2>&1 |
          tee reports/rust/personal-runtimes.log

      - name: Upload Rust reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-rust-${{ github.run_attempt }}
          path: reports/rust/
          retention-days: 14
          if-no-files-found: warn

  app-e2e:
    name: Application E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Setup repository Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-e2e
      - name: Prepare reports
        run: mkdir -p reports/e2e
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package declarations
        run: pnpm build:types
      - name: Build web frontend
        id: web
        run: pnpm build 2>&1 | tee reports/e2e/web-build.log
      - name: Build backend before starting the test runner
        id: server
        run: cargo build --locked -p wealthfolio-server 2>&1 | tee reports/e2e/server-build.log
      - name: Install Chrome
        id: browser
        run: pnpm exec playwright install --with-deps chrome
      - name: Run full application suite with a fresh synthetic database
        if:
          ${{ !cancelled() && steps.server.outcome == 'success' && steps.browser.outcome ==
          'success' }}
        run: pnpm test:e2e --reporter=html,list 2>&1 | tee reports/e2e/application.log
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: reports/e2e/application-html
      - name: Run isolated profile suite
        if:
          ${{ !cancelled() && steps.web.outcome == 'success' && steps.server.outcome == 'success' &&
          steps.browser.outcome == 'success' }}
        run:
          pnpm exec playwright test --config playwright.profiles.config.ts --reporter=html,list
          --output=test-results/profiles 2>&1 | tee reports/e2e/profiles.log
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: reports/e2e/profiles-html
      - name: Upload application reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-application-${{ github.run_attempt }}
          path: |
            reports/e2e/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  android-check:
    name: Android compile check
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Android target for the repository toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          # Restore only: a PR's copy is readable only by that PR and competes
          # with the shared caches cache-warm.yml seeds on main.
          key: android
          save-if: false
      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib" >> "$GITHUB_ENV"
      - name: Check Android Rust compilation
        run: |
          toolchain="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          mkdir -p dist
          printf '<!DOCTYPE html><html></html>' > dist/index.html
          cargo check --locked -p wealthfolio-app --target aarch64-linux-android

  ios-check:
    name: iOS compile check
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install iOS targets for the repository toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          # Restore only: a PR's copy is readable only by that PR and competes
          # with the shared caches cache-warm.yml seeds on main.
          key: ios
          save-if: false
      - name: Check iOS device and simulator compilation
        run: |
          mkdir -p dist
          printf '<!DOCTYPE html><html></html>' > dist/index.html
          cargo check --locked -p wealthfolio-app --target aarch64-apple-ios
          cargo check --locked -p wealthfolio-app --target aarch64-apple-ios-sim

  build-status:
    name: Build Status
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        formatting,
        translation-parity,
        frontend-check,
        rust-check,
        app-e2e,
        android-check,
        ios-check,
      ]
    if: always()

    steps:
      - uses: actions/checkout@v4
      - name: Generate report and enforce publication gate
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_report.py
      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-${{ github.run_attempt }}
          path: reports/ci-summary.md
          retention-days: 14
          if-no-files-found: error
